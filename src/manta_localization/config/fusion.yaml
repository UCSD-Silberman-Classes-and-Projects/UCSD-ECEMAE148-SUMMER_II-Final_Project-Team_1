manta_gps_imu_ekf:
  ros__parameters:

    gps_topic: "/fix"
    imu_topic: "/imu"

    frame_id: "map"
    child_frame_id: "base_link"

    # Physically measured on Team 1's RoboCar.
    forward_axis: "y"
    forward_axis_sign: -1.0

    # CCW rotation produced negative gyro Z.
    yaw_rate_sign: -1.0

    # Absolute yaw measurement uncertainty from the BNO085 quaternion.
    imu_yaw_sigma_deg: 5.0

    # Vehicle forward is sensor -Y; quaternion yaw describes sensor +X.
    imu_yaw_offset_deg: -90.0

    gps_sigma_fallback_m: 1.5

    max_dt_s: 0.20
    path_max_points: 2000

    # Keep car stationary this long after EKF startup.
    accel_calibration_seconds: 3.0

    # Minimum horizontal GPS standard deviation.
    # NEO-F10N is standalone GNSS, not RTK.
    gps_sigma_min_m: 1.0
